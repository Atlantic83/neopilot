<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>neopilot</title>
<style>
  :root, :root[data-theme="light"]{
    --bg:#fbfbfa; --panel:#fff; --ink:#16150f; --dim:#6b6a63; --line:#e4e3dd;
    --accent:#111; --ok:#1f7a4d; --warn:#a8700a; --bad:#b3352b; --ghost:#eeede8; --info:#2f6690;
    --fix:#6f4a9e;
    --radius:14px; --logo-light:block; --logo-dark:none; --glow:rgba(168,112,10,.38);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme]){
      --bg:#141412; --panel:#1c1c19; --ink:#f2f1ea; --dim:#918f86; --line:#2e2e29;
      --accent:#f2f1ea; --ok:#4bbd84; --warn:#d9a341; --bad:#e0685c; --ghost:#262622; --info:#7aa8d4;
      --fix:#b18ad9;
      --glow:rgba(217,163,65,.45);
      --logo-light:none; --logo-dark:block;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141412; --panel:#1c1c19; --ink:#f2f1ea; --dim:#918f86; --line:#2e2e29;
    --accent:#f2f1ea; --ok:#4bbd84; --warn:#d9a341; --bad:#e0685c; --ghost:#262622; --info:#7aa8d4;
    --fix:#b18ad9;
    --logo-light:none; --logo-dark:block;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;padding:34px 20px 60px}
  .wrap{max-width:1040px;margin:0 auto;min-width:0}
  /* wrap on .top: in a narrow pane the switches move to a second row, not off the edge */
  .top{display:flex;align-items:flex-start;gap:16px;margin-bottom:8px;flex-wrap:wrap}
  .logo{height:clamp(44px,7vw,72px);width:auto;max-width:64vw}
  .logo.l{display:var(--logo-light)} .logo.d{display:var(--logo-dark)}
  .segs{margin-left:auto;display:flex;gap:8px;flex:0 0 auto}
  .seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .seg button{appearance:none;border:0;background:transparent;color:var(--dim);cursor:pointer;
    font:600 11px/1 inherit;letter-spacing:.08em;padding:8px 12px;display:flex;align-items:center}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
  .seg svg{width:13px;height:13px;display:block}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;margin-bottom:22px}
  h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
  .badges{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .badge{font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;
    border:1px solid var(--bd,var(--line));border-radius:999px;padding:3px 10px;
    color:var(--fg,var(--dim));background:var(--bbg,transparent)}
  /* mode — the blue family, saturation grows with autonomy */
  .b-mode-1{--bbg:#eff4fb;--bd:#cfdcef;--fg:#4a6d9e}
  .b-mode-2{--bbg:#e9f0fa;--bd:#c3d4eb;--fg:#3d6293}
  .b-mode-3{--bbg:#e3ecf9;--bd:#b6cce8;--fg:#2f5688}
  .b-mode-4{--bbg:#d6e3f6;--bd:#9dbbe0;--fg:#1f4374}
  /* depth — the purple family */
  .b-depth-1{--bbg:#f4f0fa;--bd:#ddd2ee;--fg:#6b559b}
  .b-depth-2{--bbg:#ece5f7;--bd:#cbbbe6;--fg:#573f8b}
  .b-depth-3{--bbg:#e2d8f3;--bd:#b8a3dd;--fg:#452f78}
  /* tier — ochre, saturation grows with the amount of work */
  .b-tier-0{--bbg:#f7f3e8;--bd:#e5dbc3;--fg:#7d6b45}
  .b-tier-1{--bbg:#f3ecdb;--bd:#dbcda9;--fg:#6e5c34}
  .b-tier-2{--bbg:#eee4cb;--bd:#cfbc8d;--fg:#5f4d26}
  .b-tier-3{--bbg:#e8dbb9;--bd:#c2ab72;--fg:#50401b}
  .b-done{--bbg:#e8f3ec;--bd:#b6d9c4;--fg:#1f7a4d}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme]) .b-mode-1{--bbg:#1a2333;--bd:#2a3a52;--fg:#9cbbe6}
    :root:not([data-theme]) .b-mode-2{--bbg:#1b263a;--bd:#2e405e;--fg:#a5c3ec}
    :root:not([data-theme]) .b-mode-3{--bbg:#1c2942;--bd:#31466a;--fg:#aecbf2}
    :root:not([data-theme]) .b-mode-4{--bbg:#1f2f4f;--bd:#3a5482;--fg:#c0d8fb}
    :root:not([data-theme]) .b-depth-1{--bbg:#221d32;--bd:#372e4f;--fg:#b8a6e0}
    :root:not([data-theme]) .b-depth-2{--bbg:#26203b;--bd:#40345c;--fg:#c5b3ec}
    :root:not([data-theme]) .b-depth-3{--bbg:#2b2346;--bd:#4b3b6c;--fg:#d3c2f7}
    :root:not([data-theme]) .b-tier-0{--bbg:#26221a;--bd:#3b3527;--fg:#cbb98d}
    :root:not([data-theme]) .b-tier-1{--bbg:#2a2519;--bd:#443b26;--fg:#d6c393}
    :root:not([data-theme]) .b-tier-2{--bbg:#2f2917;--bd:#4e4227;--fg:#e2cd97}
    :root:not([data-theme]) .b-tier-3{--bbg:#352d16;--bd:#58492a;--fg:#edd79c}
    :root:not([data-theme]) .b-done{--bbg:#16281f;--bd:#26432f;--fg:#4bbd84}
  }
  :root[data-theme="dark"] .b-mode-1{--bbg:#1a2333;--bd:#2a3a52;--fg:#9cbbe6}
  :root[data-theme="dark"] .b-mode-2{--bbg:#1b263a;--bd:#2e405e;--fg:#a5c3ec}
  :root[data-theme="dark"] .b-mode-3{--bbg:#1c2942;--bd:#31466a;--fg:#aecbf2}
  :root[data-theme="dark"] .b-mode-4{--bbg:#1f2f4f;--bd:#3a5482;--fg:#c0d8fb}
  :root[data-theme="dark"] .b-depth-1{--bbg:#221d32;--bd:#372e4f;--fg:#b8a6e0}
  :root[data-theme="dark"] .b-depth-2{--bbg:#26203b;--bd:#40345c;--fg:#c5b3ec}
  :root[data-theme="dark"] .b-depth-3{--bbg:#2b2346;--bd:#4b3b6c;--fg:#d3c2f7}
  :root[data-theme="dark"] .b-tier-0{--bbg:#26221a;--bd:#3b3527;--fg:#cbb98d}
  :root[data-theme="dark"] .b-tier-1{--bbg:#2a2519;--bd:#443b26;--fg:#d6c393}
  :root[data-theme="dark"] .b-tier-2{--bbg:#2f2917;--bd:#4e4227;--fg:#e2cd97}
  :root[data-theme="dark"] .b-tier-3{--bbg:#352d16;--bd:#58492a;--fg:#edd79c}
  :root[data-theme="dark"] .b-done{--bbg:#16281f;--bd:#26432f;--fg:#4bbd84}
  /* minmax(min(Npx,100%)): in a column narrower than 200px the card shrinks instead of spilling over */
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));margin-bottom:14px}
  /* metric rows: four cards per row hold out longer than the debt lists */
  .grid.m{grid-template-columns:repeat(auto-fit,minmax(min(168px,100%),1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;min-width:0}
  .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
  /* a long value ("1h 05min … 2h 10min", "Specification") wraps instead of being cut */
  .v{font-size:30px;font-weight:650;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;
    overflow-wrap:anywhere}
  .v.stage{font-size:clamp(17px,4.4vw,22px)}
  .v small{font-size:14px;font-weight:500;color:var(--dim);letter-spacing:0}
  .sub{font-size:12.5px;color:var(--dim);margin-top:6px;overflow-wrap:anywhere}
  .hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .hero>div{min-width:0}
  .ring{flex:0 0 84px}
  .bar{height:6px;background:var(--ghost);border-radius:99px;overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
  .bar.lg{height:10px;margin-top:12px}
  /* overall progress: stages by weight, inside development — the share of finished tickets */
  .overall{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:14px}
  .overall-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .overall-head b{font-size:24px;font-weight:650;letter-spacing:-.02em;text-transform:none;
    color:var(--ink);font-variant-numeric:tabular-nums}
  .overall-head b small{font-size:14px;font-weight:500;color:var(--dim)}
  h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);
    margin:26px 0 12px;font-weight:600}
  .tl{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;min-width:0}
  /* the ticket summary — the answer to "where is the build" before you peer into the bars */
  .tlsum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chip{font-size:11.5px;letter-spacing:.03em;border:1px solid var(--line);border-radius:999px;
    padding:3px 10px;color:var(--dim);font-variant-numeric:tabular-nums}
  .chip.ok{border-color:var(--ok);color:var(--ok)}
  .chip.run{border-color:var(--warn);color:var(--warn)}
  .chip.info{border-color:var(--info);color:var(--info)}
  .chip.bad{border-color:var(--bad);color:var(--bad)}
  .chip.fix{border-color:var(--fix);color:var(--fix)}
  /* the ticket phase right on the tile: "review" and "repair" are states that
     did not exist before, and one color alone cannot tell them apart */
  .fill .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .fill .ph{margin-left:8px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
    opacity:.85;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:1px 6px;flex:none}
  .tlnow{font-size:13px;margin:-4px 0 12px;overflow-wrap:anywhere}
  .tlnow .lbl{color:var(--dim)}
  .tlnow b{font-weight:650;font-variant-numeric:tabular-nums}
  .tlnow .nowclock{color:var(--warn);font-variant-numeric:tabular-nums}
  .wave{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:14px 0 8px}
  .wave:first-child{margin-top:0}
  /* minmax(0,1fr), not 1fr: 1fr floors at min-content, and a long ticket name pushes the grid past the screen */
  .row{display:grid;grid-template-columns:26px minmax(0,1fr) 56px;gap:10px;align-items:center;margin-bottom:6px;font-size:13px}
  .row b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--dim)}
  .row.now b{color:var(--ink)}
  .track{background:var(--ghost);border-radius:6px;height:22px;position:relative;overflow:hidden;min-width:0}
  .fill{position:absolute;inset:0 auto 0 0;border-radius:6px;display:flex;align-items:center;
    padding:0 8px;white-space:nowrap;font-size:12px;color:#fff;overflow:hidden}
  /* a waiting ticket is an empty outline, not a filled track: the tile is now
     full-width, and without this "waiting" would read as yet another fill state */
  .row.wait .track{background:transparent;border:1px dashed var(--line)}
  .fill.pend{background:transparent;border:0;color:var(--dim)}
  /* "in work" must read as alive, not as fading: the tile used to sink to
     opacity .3 together with the ticket name. Now the glow around the track
     and the tile's brightness breathe; the text stays readable the whole time. */
  .row.now .track{animation:trackGlow 1.9s ease-in-out infinite}
  /* a sheen runs across the running ticket's tile — motion without a false percentage */
  .fill.active::after{content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent 0,rgba(255,255,255,.30) 50%,transparent 100%);
    transform:translateX(-100%);animation:sheen 1.9s ease-in-out infinite}
  .mins{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px}
  /* the stages — a vertical ribbon with a rail */
  .stages{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:4px 18px;min-width:0}
  .st{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;align-items:start;
    padding:10px 0;border-bottom:1px solid var(--line)}
  .st:last-child{border-bottom:0}
  .st .rail{position:relative;align-self:stretch;min-height:18px}
  .st .rail::before{content:"";position:absolute;left:9px;top:-10px;bottom:-10px;width:1px;background:var(--line)}
  .st:first-child .rail::before{top:9px}
  .st:last-child .rail::before{bottom:calc(100% - 9px)}
  .st .rail i{position:absolute;left:4px;top:3px;width:11px;height:11px;border-radius:99px;
    box-sizing:border-box;border:2px solid var(--line);background:var(--panel)}
  .st.done .rail i{background:var(--ok);border-color:var(--ok)}
  .st.active .rail i{background:var(--warn);border-color:var(--warn);animation:pulse 1.6s ease-in-out infinite}
  .st.failed .rail i{background:var(--bad);border-color:var(--bad)}
  .st.skipped .rail i{border-style:dashed;background:var(--panel)}
  .st>div{min-width:0}
  .st .nm{font-size:13.5px;overflow-wrap:anywhere}
  .st.active .nm{font-weight:650}
  .st.done .nm,.st.skipped .nm{color:var(--dim)}
  .st .mins{padding-top:1px}
  @keyframes trackGlow{
    0%,100%{box-shadow:0 0 0 0 var(--glow)}
    50%{box-shadow:0 0 0 4px transparent}
  }
  @keyframes sheen{to{transform:translateX(100%)}}
  /* for those with system animation off — just a static highlight */
  @media (prefers-reduced-motion:reduce){
    .row.now .track{animation:none;box-shadow:0 0 0 3px var(--glow)}
    .fill.active::after{animation:none;background:none}
  }
  .note{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 18px;font-size:13px;color:var(--dim)}
  .note b{color:var(--ink);font-weight:600}
  .stale{color:var(--warn)}
  /* Clocks stopped by idle: the digits fade so a standing timer does not read as a fault. */
  .paused{opacity:.5}
  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);
    font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
  td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  .dot{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:7px;vertical-align:1px}
  .tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:5px;
    padding:1px 5px;margin:0 3px 3px 0;color:var(--dim);font-variant-numeric:tabular-nums}
  ul.debt{margin:0;padding-left:18px}
  ul.debt li{margin-bottom:4px;font-size:13px}
  .empty{color:var(--dim);font-size:13px}
  footer{margin-top:24px;font-size:12px;color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
  footer code{overflow-wrap:anywhere}
  .scroll{overflow-x:auto}
  /* the tickets table scrolls inside its own frame instead of mashing seven columns */
  .scroll table{min-width:560px}
  /* the run's documents — the manifest, spec, and ticket files open on click */
  .docs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .docs .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .docb{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:999px;
    padding:4px 12px;background:transparent;color:var(--dim);cursor:pointer;text-decoration:none}
  .docb:hover{border-color:var(--accent);color:var(--ink)}
  .linkb{font:inherit;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;text-align:left}
  .linkb:hover{color:var(--accent);text-decoration:underline}
  .docv{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;
    justify-content:center;padding:24px;z-index:50}
  .docv[hidden]{display:none}
  .docbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    width:min(880px,100%);max-height:86vh;display:flex;flex-direction:column;min-width:0}
  .doch{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
  .doch .t{font-weight:650;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .doch .sp{flex:1}
  .doch a{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .doch button{font:inherit;border:1px solid var(--line);background:transparent;color:var(--dim);
    border-radius:6px;padding:3px 10px;cursor:pointer}
  .doch button:hover{color:var(--ink);border-color:var(--accent)}
  .docbody{overflow:auto;padding:8px 22px 22px;font-size:13.5px;line-height:1.55}
  .docbody h1{font-size:20px;margin:18px 0 10px}
  .docbody h2{font-size:16px;margin:20px 0 8px;letter-spacing:0;text-transform:none;color:var(--ink)}
  .docbody h3{font-size:14px;margin:16px 0 6px}
  .docbody h4{font-size:13px;margin:14px 0 6px}
  .docbody p{margin:8px 0}
  .docbody ul,.docbody ol{margin:8px 0;padding-left:22px}
  .docbody li{margin:3px 0}
  .docbody code{background:var(--ghost);border-radius:4px;padding:1px 5px;font-size:12.5px}
  .docbody pre{background:var(--ghost);border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;overflow:auto;font-size:12.5px;line-height:1.5}
  .docbody pre code{background:none;padding:0}
  .docbody blockquote{border-left:3px solid var(--line);margin:10px 0;padding:2px 14px;color:var(--dim)}
  .docbody hr{border:0;border-top:1px solid var(--line);margin:16px 0}
  .docbody table{margin:10px 0;font-size:12.5px}
  .docbody a{color:var(--accent)}
  .docbody img{max-width:100%}
  /* the narrow layout: an embedded IDE pane, a side column, a phone */
  @media (max-width:460px){
    body{padding:20px 12px 44px}
    .top{gap:10px}
    header{gap:8px;margin-bottom:16px}
    h1{font-size:15px}
    h2{margin:20px 0 10px}
    .card,.overall,.tl,.note{padding:13px 14px}
    .stages{padding:2px 14px}
    .v{font-size:25px}
    .overall-head b{font-size:21px}
    .ring{flex:0 0 68px;width:68px;height:68px}
    .hero{gap:12px}
    .row{grid-template-columns:24px 1fr 48px;gap:8px}
    .st{grid-template-columns:18px 1fr auto;gap:9px}
    .badges{margin-left:0}
    .segs{margin-left:0}
    /* seven columns never fit a narrow pane at any min-width, so here the
       table stops demanding width and the secondary columns leave:
       requirements, retries, and the commit live in the files — "what runs
       and for how long" does not */
    .scroll table{min-width:0}
    th:nth-child(3),td:nth-child(3),
    th:nth-child(5),td:nth-child(5),
    th:nth-child(7),td:nth-child(7){display:none}
    /* only the ticket name wraps: headers and numbers must not tear by letter */
    th,td{padding:9px 8px;white-space:nowrap}
    td:nth-child(2){white-space:normal;overflow-wrap:anywhere}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<!-- State arrives two ways, and the order of these two tags is the whole point.
     First the snapshot written inside the page: it is always there, so the
     dashboard shows data however it is opened — a double click, a pane via
     data:, a dead server, a month after the run. Then the file beside it: it
     overrides the snapshot wherever the page has an address, and it is
     re-fetched every ten seconds so the clocks run without a reload.
     They cannot drift in opposite directions: the file is written on every
     edit, the snapshot on every .neopilot/sync.py call — and that same call
     writes the file into the page, so the snapshot is either equal to the
     file or older than it.
     Between the markers only sync.py writes; by hand — never. -->
<script>/*STATE-BEGIN*/window.STATE=null;/*STATE-END*/</script>
<script src="state.js"></script>

<script>
const MODE_CLS  = {manual:'b-mode-1', interview:'b-mode-2', semi:'b-mode-3', full:'b-mode-4'};
const DEPTH_CLS = {strict:'b-depth-1', normal:'b-depth-2', deep:'b-depth-3'};
const TIER_CLS  = {T0:'b-tier-0', T1:'b-tier-1', T2:'b-tier-2', T3:'b-tier-3'};

// The full build cycle. state.js may send fewer — the missing ones render as pending.
const STAGE_IDS = ['preflight','manifest','briefing','spec','plan','build','review','final'];

const systemDark = () => {
  try { return matchMedia('(prefers-color-scheme: dark)').matches; } catch(e) { return false; }
};
const storedTheme = () => {
  try { return localStorage.getItem('neopilot-theme'); } catch(e) { return null; }
};
// The user's explicit choice overrides the system theme; before the first click — the system one.
function effectiveTheme(){
  return storedTheme() || (systemDark() ? 'dark' : 'light');
}
function applyTheme(t){
  if (t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}

    blindV:(m,c)=>`${m} / ${c} requirements confirmed`,

    depths:{strict:"strictly as written",normal:"normal depth",deep:"maximum depth"},

    themeLabel:"Theme",themeLight:"Light theme",themeDark:"Dark theme"}

let CUR = I18N.en;                 // the language currently rendered — the ticking timers need it
let autoOn = true;
try { autoOn = (localStorage.getItem('neopilot-auto') || 'on') !== 'off'; } catch(e) {}
let pollT = null;
let lastStamp = null;              // the rendered state's stamp — against needless repaints

// ——— live timers —————————————————————————————————————————————————
// All time is computed from state.js marks. An open interval ticks from now.
const spanMs = (from, to) => {
  const a = from ? new Date(from).getTime() : NaN;
  if (isNaN(a)) return null;
  const b = to ? new Date(to).getTime() : Date.now();
  return Math.max(0, b - a);
};
// ——— active time ————————————————————————————————————————————————
// The run's clock shows work, not the calendar: a person gone for a day —
// the clock stands still. No extra bookkeeping is needed for that.
// state.js is already studded with marks — start, stages, tickets,
// updatedAt — and a gap between neighbouring marks longer than the
// threshold is idle, not work. The threshold is the same as the "silence"
// one below: forty-five minutes.
// Measured on real runs 2026-08-19: work fits in an hour between marks,
// while idle stretches for hours and days (444 minutes, 4207, 7814), so
// the crude cut is off by a few percent at most and requires not a single
// new edit from the agent.
const IDLE_CAP_MS = 2700000;
let MARKS = [];
// `updatedAt` is the only sliding mark: the agent overwrites it and the
// previous pulse disappears from the file. So the page remembers every
// value it has seen: without this the counter jumped back by the
// threshold's worth the moment the agent returned from an idle (verified
// 2026-08-19). Stored per run, survives a reload.
function rememberBeats(S){
  const key = 'neopilot-beats:' + (S.slug || '') + ':' + (S.startedAt || '');
  try {
    const seen = JSON.parse(localStorage.getItem(key) || '[]');
    if (S.updatedAt && seen.indexOf(S.updatedAt) === -1) {
      seen.push(S.updatedAt);
      localStorage.setItem(key, JSON.stringify(seen.slice(-600)));
    }
    return seen;
  } catch (e) { return []; }
}
function collectMarks(S){
  const out = [];
  const push = v => { const t = v ? new Date(v).getTime() : NaN; if (!isNaN(t)) out.push(t); };
  push(S.startedAt); push(S.updatedAt); push(S.finishedAt);
  (S.beats || []).forEach(push);                    // the pulse journal, if the run keeps one
  rememberBeats(S).forEach(push);                   // and what the page saw with its own eyes
  (S.stages || []).forEach(x => { push(x.startedAt); push(x.finishedAt); });
  (S.tickets || []).forEach(x => { push(x.startedAt); push(x.finishedAt); });
  ((S.polish || {}).rounds || []).forEach(x => push(x.finishedAt));
  return Array.from(new Set(out)).sort((a, b) => a - b);
}
// The sum of gaps between marks; each is cut at the idle threshold.
function activeMs(from, to){
  const a = from ? new Date(from).getTime() : NaN;
  if (isNaN(a)) return null;
  const b = to ? new Date(to).getTime() : Date.now();
  if (b <= a) return 0;
  const pts = [a].concat(MARKS.filter(t => t > a && t < b), [b]);
  let s = 0;
  for (let i = 1; i < pts.length; i++) s += Math.min(pts[i] - pts[i-1], IDLE_CAP_MS);
  return s;
}
// Are the clocks standing right now — is the idle stretching past the threshold?
function idleNow(){
  const S = window.STATE || {};
  if (!S || S.finishedAt) return false;
  const last = MARKS.length ? MARKS[MARKS.length - 1] : null;
  return last != null && Date.now() - last > IDLE_CAP_MS;
}
const fmtClock = ms => {
  if (ms == null) return '—';
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
  const p = n => String(n).padStart(2,'0');
  return h ? `${h}:${p(m)}:${p(ss)}` : `${m}:${p(ss)}`;
};
// An open interval gets data-live — tick() refreshes it every second.
function timerHTML(from, to){
  const ms = activeMs(from, to);
  if (ms == null) return '—';
  return to ? `<span>${fmtClock(ms)}</span>`
            : `<span data-live data-from="${from}">${fmtClock(ms)}</span>`;
}
function agoText(iso){
  const ms = spanMs(iso, null);
  if (ms == null) return '—';
  const s = Math.floor(ms/1000);
  if (s < 60) return CUR.agoSec(s);
  const m = Math.floor(s/60);
  return m < 60 ? CUR.agoMin(m) : CUR.agoHr(Math.floor(m/60), m%60);
}
function tick(){
  const stopped = idleNow();
  document.querySelectorAll('[data-live][data-from]').forEach(el => {
    el.textContent = fmtClock(activeMs(el.dataset.from, null));
    el.classList.toggle('paused', stopped);          // clocks standing — visible it is not a fault
  });
  document.querySelectorAll('[data-idle-note]').forEach(el => {
    el.hidden = !stopped;
    if (!stopped) return;
    // "Silence" reads differently: tickets in flight without marks are normal
    // (the orchestrator writes at boundaries), an empty run without marks is a
    // pause, and hours of silence with no work at all is a reason to check
    // whether the session is alive at all.
    const idleMin = Math.floor((Date.now() - MARKS[MARKS.length - 1]) / 60000);
    const busy = ((window.STATE || {}).tickets || []).some(t =>
      t.status === 'in-progress' || t.status === 'review' || t.status === 'repair');
    el.textContent = idleMin >= 240 ? CUR.idleLong(Math.max(1, Math.floor(idleMin / 60)))
                   : busy ? CUR.idleBusy(idleMin) : CUR.paused;
  });
  document.querySelectorAll('[data-ago]').forEach(el => {
    el.textContent = agoText(el.dataset.ago);
    // Silence is a reason to look closer, but only while nobody is working.
    // While at least one ticket is running, no marks inside it is by design:
    // the orchestrator writes at boundaries and a ticket lives for tens of
    // minutes. The threshold then is not five minutes but well past the
    // longest ticket.
    const S = window.STATE || {};
    const busy = (S.tickets || []).some(t =>
      t.status === 'in-progress' || t.status === 'review' || t.status === 'repair');
    el.classList.toggle('stale', !S.finishedAt
      && spanMs(el.dataset.ago, null) > (busy ? 2700000 : 300000));
  });
}

// ——— the run's documents —————————————————————————————————————————
// manifest.md, spec.md, and the ticket files live beside state.js, in the
// run's directory, and the server serves them — so they can be read right
// here, without a separate tab. The modal lives outside #app: state
// repaints do not touch it.
const escH = s => String(s == null ? '' : s)
  .replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function docUrl(f){
  const S = window.STATE || {};
  return encodeURI((S.dir || S.slug || '') + '/' + f);
}

// A mini markdown renderer: headings, tables, lists, quotes, code — enough
// for manifest/spec/tickets. The page has no external dependencies by contract.
function mdHtml(src){
  const fixUrl = u => {
    u = String(u || '').trim();
    if (/^\s*javascript:/i.test(u)) return null;
    if (/^(https?:|\/|#|data:|mailto:)/i.test(u)) return u;
    return ((window.STATE || {}).dir || '') + '/' + u;   // relative — off the run's directory
  };
  const inline = s => {
    let x = escH(s);
    x = x.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    x = x.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (m, alt, u) => {
      const v = fixUrl(u); return v ? `<img alt="${alt}" src="${v}">` : alt; });
    x = x.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (m, t, u) => {
      const v = fixUrl(u); return v ? `<a href="${v}" target="_blank" rel="noopener">${t}</a>` : t; });
    x = x.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    x = x.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
    x = x.replace(/~~([^~]+)~~/g, '<s>$1</s>');
    return x;
  };
  const lines = String(src).replace(/\r\n?/g, '\n').split('\n');
  const struct = /^#{1,4}\s|^```|^\s*>|^\s*([-*+]|\d+[.)])\s|^\s*\|/;
  const out = [];
  let i = 0;
  while (i < lines.length){
    const ln = lines[i];
    if (!ln.trim()){ i++; continue; }
    if (/^```/.test(ln.trim())){                                  // fenced code
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i].trim())) buf.push(lines[i++]);
      i++;
      out.push('<pre><code>' + escH(buf.join('\n')) + '</code></pre>');
      continue;
    }
    if (ln.includes('|') && i + 1 < lines.length                  // a table: a row + a divider
        && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]) && lines[i+1].includes('-')){
      const rows = [];
      while (i < lines.length && lines[i].includes('|')) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|')
        .map(c => inline(c.trim()));
      const head = cells(rows.shift()); rows.shift();             // the second is the divider
      out.push('<table><thead><tr>' + head.map(c => '<th>' + c + '</th>').join('') +
        '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + cells(r).map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') +
        '</tbody></table>');
      continue;
    }
    const h = ln.match(/^(#{1,4})\s+(.*)$/);
    if (h){ out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(ln)){ out.push('<hr>'); i++; continue; }
    if (/^\s*>/.test(ln)){
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
      out.push('<blockquote>' + buf.map(inline).join('<br>') + '</blockquote>');
      continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(ln)){
      const ordered = /^\s*\d/.test(ln);
      const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])){
        let it = lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, '');
        const ck = it.match(/^\[( |x|X)\]\s*/);
        if (ck) it = (ck[1].trim() ? '☑ ' : '☐ ') + it.slice(ck[0].length);
        items.push('<li>' + inline(it) + '</li>');
      }
      out.push((ordered ? '<ol>' : '<ul>') + items.join('') + (ordered ? '</ol>' : '</ul>'));
      continue;
    }
    const buf = [ln]; i++;
    while (i < lines.length && lines[i].trim() && !struct.test(lines[i])
           && !/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i])) buf.push(lines[i++]);
    out.push('<p>' + buf.map(inline).join('<br>') + '</p>');
  }
  return out.join('');
}

let docVeil = null;
function ensureDocVeil(){
  if (docVeil) return docVeil;
  docVeil = document.createElement('div');
  docVeil.className = 'docv'; docVeil.hidden = true;
  docVeil.innerHTML = `<div class="docbox" role="dialog" aria-modal="true">
    <div class="doch"><span class="t"></span><span class="sp"></span>
      <a target="_blank" rel="noopener"></a>
      <button type="button" data-x>✕</button></div>
    <div class="docbody"></div></div>`;
  document.body.appendChild(docVeil);
  docVeil.addEventListener('click', e => { if (e.target === docVeil) closeDoc(); });
  docVeil.querySelector('[data-x]').addEventListener('click', closeDoc);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && docVeil && !docVeil.hidden) closeDoc(); });
  return docVeil;
}
function closeDoc(){ if (docVeil) docVeil.hidden = true; }

function showDoc(title, file){
  const v = ensureDocVeil();
  v.querySelector('.t').textContent = title;
  const a = v.querySelector('.doch a');
  if (file){ a.textContent = file; a.href = docUrl(file); a.style.display = ''; }
  else a.style.display = 'none';
  v.querySelector('[data-x]').title = CUR.docClose;
  const body = v.querySelector('.docbody');
  body.innerHTML = '<div class="empty">…</div>';
  v.hidden = false;
  return body;
}
async function openDoc(file, title){
  const body = showDoc(title, file);
  try {
    const r = await fetch(docUrl(file) + '?t=' + Date.now());
    if (!r.ok){ body.innerHTML = `<div class="empty">${escH(CUR.docNoFile)}</div>`; return; }
    body.innerHTML = mdHtml(await r.text());
  } catch (e) {
    body.innerHTML = `<div class="empty">${escH(CUR.docNoFetch)}</div>`;
  }
}
// The ticket's file name is not fixed by the document — we match it from the directory listing.
async function openTicket(t){
  const id = String(t.id), title = '#' + id + ' — ' + (t.title || '');
  let files = [];
  try {
    const r = await fetch(docUrl('tickets/') + '?t=' + Date.now());
    if (r.ok) files = [...(await r.text()).matchAll(/href="([^"]+\.md)"/g)]
      .map(m => decodeURIComponent(m[1].split('/').pop()));
  } catch (e) {}
  const hit = files.find(f => f === id + '.md' || f.startsWith(id + '-') || f.startsWith(id + '_'));
  if (hit) openDoc('tickets/' + hit, title);
  else showDoc(title, null).innerHTML = `<div class="empty">${escH(CUR.docNoFile)}</div>`;
}

// ——— auto-refresh ————————————————————————————————————————————————
// The page does not reload: it pulls state.js again through a separate tag.
// That is because embedded panes (Claude Desktop, IDE viewers) mute
// navigation — location.reload() and <meta http-equiv="refresh"> silently
// do nothing there, while a subresource load is left alone. Verified by
// measurement: reload and meta refresh never once worked, the tag load
// worked twelve times out of twelve. A side benefit — "refresh" no longer
// means "lose your place": the repaint preserves selection and scroll
// position.
// But subresources only exist for a page that has an address. The Claude
// pane does not open file:// as a page — it pastes HTML into
// data:text/html, and from there the origin is null: state.js will not
// load by relative path, absolute file://, or fetch. So the state is also
// written inside the page: where there is no address, the dashboard shows
// the snapshot and stays quiet about updates instead of showing a blank
// screen. Live refresh stays with http (a pane via preview_start, a
// regular browser) — phases/0-instruments.md.
// Visibility is NOT checked: those same panes keep document.hidden ===
// true all the time, even though the user is looking right at them.
const stampOf = S => (S.updatedAt || '') + '|' + (S.finishedAt || '') + '|' + (S.tickets || []).length;

function applyState(){
  const S = window.STATE;
  if (!S || typeof S !== 'object') return;
  // Repaint only when the state actually moved: a silent repaint every ten
  // seconds would wipe the selected text for nothing.
  const stamp = stampOf(S);
  if (stamp === lastStamp) return;
  lastStamp = stamp;
  const y = window.scrollY;
  // A crashed render must not kill the page: reset the stamp so the next
  // poll round tries again — otherwise a fixed state.js never gets picked
  // up.
  try { render(CUR.lang); } catch (e) { lastStamp = ''; bootFail(String(e && e.message || e)); }
  window.scrollTo(0, y);
}

function pollState(){
  clearTimeout(pollT);
  if (!autoOn || (window.STATE && window.STATE.finishedAt)) return;
  pollT = setTimeout(() => {
    const s = document.createElement('script');
    // The timestamp in the request — or file:// serves the script from cache.
    s.src = 'state.js?t=' + Date.now();
    // An error is routine: the file may be caught mid-write. The old state
    // stays on screen; the next round in ten seconds picks up the whole.
    const next = () => { s.remove(); applyState(); pollState(); };
    s.onload = next;
    s.onerror = next;
    document.head.appendChild(s);
  }, POLL_MS);
}

// ——— the state check ——————————————————————————————————————————————
// The same audit sync.py prints to the agent's console — ported to field
// logic and living inside the page. The point: findings are visible live,
// every ten seconds, not only when the agent remembers to call sync —
// "sync was never called" was the last hole where a contradiction could
// sit unnoticed for a whole run. The filesystem side (is spec.md on disk)
// cannot be checked from a browser — those strings stay the console
// audit's domain. The strings are identical to sync.py, word for word:
// one finding — one text, searchable on both sides.
function auditState(S){
  const out = [], stages = S.stages || [], T = S.tickets || [];
  const ORDER = ['preflight','manifest','briefing','spec','plan','build','review','final'];
  const rank = {}; ORDER.forEach((v, i) => rank[v] = i);
  const iso = v => { const d = typeof v === 'string' ? new Date(v) : null;
                     return d && !isNaN(d) ? d : null; };
  const ACTIVE_T = ['in-progress','review','repair'], TERM_T = ['done','failed'];

  const live = stages.filter(s => s.status === 'active' && s.id in rank).map(s => s.id);
  if (live.length){
    const edge = Math.max(...live.map(i => rank[i]));
    stages.forEach(s => {
      if (s.status === 'pending' && (s.id in rank ? rank[s.id] : 99) < edge)
        out.push(`stage ${s.id} stayed pending while the run moved on — close it done or skipped with a reason`);
    });
  }
  stages.forEach(s => {
    if (s.status === 'active' && !s.startedAt) out.push(`stage ${s.id} active without startedAt — its clock runs off the neighbour`);
    if (s.status === 'done' && !s.finishedAt) out.push(`stage ${s.id} closed without finishedAt`);
    if (s.status === 'skipped' && !s.note) out.push(`stage ${s.id} skipped without a reason — note is required`);
  });
  const MARKS = ['startedAt','finishedAt','commit','tests','retries','repairs','handoffs','repairFindings'];
  T.forEach(t => {
    if (ACTIVE_T.includes(t.status) && !t.startedAt) out.push(`task ${t.id} in work without startedAt`);
    if (TERM_T.includes(t.status) && !t.finishedAt) out.push(`task ${t.id} closed without finishedAt`);
    ['repairs','retries','handoffs'].forEach(k => {
      if ((t[k] || 0) > 2) out.push(`task ${t.id} ${k}=${t[k]} — ceiling is 2, beyond that failed or a re-cut`);
    });
    if (t.status === 'pending' && MARKS.some(k => t[k]))
      out.push(`task ${t.id} — pending, but its marks say it worked: status never switched`);
    if (t.commit && t.status !== 'done')
      out.push(`task ${t.id} committed (${t.commit}), but status is ${t.status} — done not recorded`);
    if (t.finishedAt && !TERM_T.includes(t.status))
      out.push(`task ${t.id} has finishedAt, but status is ${t.status}`);
  });
  const byid = {}, dup = new Set();
  T.forEach(t => { const id = String(t.id);
    if (id in byid && !dup.has(id)) { dup.add(id);
      out.push(`duplicate task id ${id} — --set by id edits the first match`); }
    if (!(id in byid)) byid[id] = t; });
  T.forEach(t => (t.blockedBy || []).forEach(b => {
    const bs = String(b);
    if (bs === String(t.id)) { out.push(`task ${t.id} blocks itself — eternal pending`); return; }
    const bt = byid[bs];
    if (!bt) { out.push(`task ${t.id} waits on blocker ${bs} — no such task`); return; }
    if (bt.status === 'pending' && [...ACTIVE_T, ...TERM_T].includes(t.status))
      out.push(`task ${t.id} is ${t.status}, but its blocker ${bs} is still pending — blocker status not recorded`);
    else if (ACTIVE_T.includes(bt.status) && t.status === 'done')
      out.push(`task ${t.id} closed, but its blocker ${bs} is still ${bt.status} — blocker done not recorded`);
  }));
  const rev = stages.find(s => s.id === 'review');
  const revLive = Object.values(S.reviewers || {}).some(v => v);
  T.forEach(t => {
    if (['review','repair'].includes(t.status)){
      if (!rev || rev.status === 'pending')
        out.push(`task ${t.id} in review, but the review stage is not open — --enter review`);
      if (!revLive) out.push(`task ${t.id} in review, but reviewer handles are not recorded`);
    }
    if (t.status === 'done' && !t.commit)
      out.push(`task ${t.id} done without a commit — rollback point not recorded`);
  });
  if (rev && ['done','skipped'].includes(rev.status)){
    const hang = T.filter(t => ['review','repair'].includes(t.status)).map(t => t.id);
    if (hang.length) out.push(`review stage ${rev.status}, but tasks ${hang.join(', ')} are still under review`);
  }
  const reaches = start => {
    const stack = [start], seen = new Set();
    while (stack.length){ const cur = stack.pop();
      for (const b of (cur.blockedBy || [])){
        if (cur === start && String(b) === String(start.id)) continue;
        const bt = byid[String(b)];
        if (!bt || seen.has(bt)) continue;
        if (bt === start) return true;
        seen.add(bt); stack.push(bt);
      } }
    return false;
  };
  const cyc = T.filter(t => reaches(t)).map(t => String(t.id));
  if (cyc.length) out.push(`blockedBy cycle: ${cyc.join(', ')} — eternal pending`);
  const sp = S.singlePass || {};
  const pairs = [['run', S.startedAt, S.finishedAt], ['singlePass', sp.startedAt, sp.finishedAt],
    ...stages.map(s => [`stage ${s.id}`, s.startedAt, s.finishedAt]),
    ...T.map(t => [`task ${t.id}`, t.startedAt, t.finishedAt])];
  pairs.forEach(([n, a, b]) => { const da = iso(a), db = iso(b);
    if (da && db && db < da) out.push(`${n}: finishedAt earlier than startedAt — marks swapped`); });
  const fin = iso(S.finishedAt);
  if (fin) pairs.forEach(([n, a, b]) => {
    if ([a, b].some(m => { const d = iso(m); return d && d > fin; }))
      out.push(`${n}: mark later than the run's finishedAt — work after landing`); });
  const stmap = {}; stages.forEach(s => stmap[s.id] = s);
  if (stmap.manifest?.status === 'done' && !S.briefFile)
    out.push('manifest stage done, but briefFile is not recorded — the brief is lost');
  if (stmap.spec?.status === 'done' && S.coverage == null)
    out.push('spec stage done, but coverage is not recorded — gate G2 skipped');
  if (stmap.plan?.status === 'done' && String(S.tier).toUpperCase() !== 'T0' && !T.length)
    out.push(`plan stage done at tier ${S.tier}, but there are no tasks — the breakdown is not recorded`);
  const bst = stmap.build || {};
  if (['done','skipped'].includes(bst.status)){
    const hang = T.filter(t => !TERM_T.includes(t.status)).map(t => t.id);
    if (hang.length) out.push(`build stage ${bst.status}, but tasks ${hang.join(', ')} are not closed`);
  } else if (!bst.status || bst.status === 'pending'){
    const fly = T.filter(t => ACTIVE_T.includes(t.status)).map(t => t.id);
    if (fly.length) out.push(`tasks ${fly.join(', ')} in work, but the build stage is not open — --enter build`);
  }
  const fst = stmap.final || {};
  if (fst.status === 'done'){
    if (!S.finishedAt) out.push('final stage done, but the run\'s finishedAt is not recorded — the clock is ticking');
    if (S.blind == null) out.push('final stage done, but the blind acceptance is not recorded');
    else if (typeof S.blind.checked !== 'number' || typeof S.blind.matched !== 'number')
      out.push('blind recorded without the checked/matched counts — the acceptance card is empty');
  }
  const upd = iso(S.updatedAt);
  if (upd){
    const marks = [S.finishedAt, (S.blind || {}).ranAt, sp.startedAt, sp.finishedAt];
    stages.forEach(s => marks.push(s.startedAt, s.finishedAt));
    T.forEach(t => marks.push(t.startedAt, t.finishedAt));
    if (marks.some(m => { const d = iso(m); return d && d > upd; }))
      out.push('a mark is newer than updatedAt — the pulse moves on every state.js edit');
  }
  if (S.finishedAt){
    stages.forEach(s => { if (['active','pending'].includes(s.status))
      out.push(`the run is closed, but stage ${s.id} is still ${s.status} — mark it done or skipped`); });
    T.forEach(t => { if (ACTIVE_T.includes(t.status))
      out.push(`the run is closed, but task ${t.id} is still ${t.status}`); });
  }
  return out;
}

function render(lang){
  const L = I18N[lang] || I18N.en;
  CUR = L;
  const S = STATE, T = S.tickets || [], R = S.requirements || {};
  MARKS = collectMarks(S);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // A page without an address (a data: pane) can fetch neither a file nor a
  // listing — the document buttons are not drawn there at all.
  const hasAddr = location.protocol !== 'data:';
  // A ticket lives in three active states, not one: writing — reviewing —
  // repairing. Review and repair run while the next ticket is in flight, so
  // "done 2 of 8" without them is the screen's most frequent question:
  // "and what about the third one?"
  const ACTIVE = ['in-progress', 'review', 'repair'];
  const done = T.filter(t => t.status === 'done');
  const writing = T.filter(t => t.status === 'in-progress');
  const inReview = T.filter(t => t.status === 'review');
  const inRepair = T.filter(t => t.status === 'repair');
  const running = T.filter(t => ACTIVE.includes(t.status));
  const failedT = T.filter(t => t.status === 'failed');
  const waiting = T.length - done.length - running.length - failedT.length;
  const live = Math.max(0, (R.total || 0) - (R.dropped || 0));

  const mins = t => (t.startedAt && t.finishedAt)
    ? Math.max(1, Math.round(activeMs(t.startedAt, t.finishedAt) / 60000)) : null;
  const durations = done.map(mins).filter(Boolean).sort((a,b) => a-b);
  const median = durations.length ? durations[Math.floor(durations.length/2)] : null;
  const fmtDur = m => m == null ? '—'
    : m < 60 ? m + ' ' + L.min : Math.floor(m/60) + ' ' + L.hr + ' ' + String(m%60).padStart(2,'0') + ' ' + L.min;

  const byId = Object.fromEntries(T.map(t => [t.id, t]));
  const memo = {};
  function depth(id, seen){
    const t = byId[id];
    if (!t || t.status === 'done') return 0;
    if (memo[id] != null) return memo[id];
    if (seen.has(id)) return 1;
    seen.add(id);
    const d = 1 + Math.max(0, ...(t.blockedBy || []).map(b => depth(b, seen)));
    seen.delete(id);
    return memo[id] = d;
  }
  const cp = Math.max(0, ...T.map(t => depth(t.id, new Set())));

  // The estimate is counted in minutes along the chain, not "median × chain
  // length": otherwise a ticket in its twenty-seventh minute counts in the
  // estimate as not started, and on the last nearly-finished ticket the
  // screen says "21 … 39 min".
  const memoMin = {};
  const leftFor = t => {
    if (!t || t.status === 'done') return 0;
    const full = median || 10;
    // the code is written — the check remains, and maybe a fix on a finding
    if (t.status === 'review') return full * 0.2;
    if (t.status === 'repair') return full * 0.5;
    if (t.status === 'in-progress' && t.startedAt) {
      const elapsed = (activeMs(t.startedAt, null) || 0) / 60000;
      return Math.max(1, full - elapsed);          // already running — less remains
    }
    return full;
  };
  function chainMin(id, seen){
    const t = byId[id];
    if (!t || t.status === 'done') return 0;
    if (memoMin[id] != null) return memoMin[id];
    if (seen.has(id)) return leftFor(t);
    seen.add(id);
    const d = leftFor(t) + Math.max(0, ...(t.blockedBy || []).map(b => chainMin(b, seen)));
    seen.delete(id);
    return memoMin[id] = d;
  }
  const cpMin = Math.max(0, ...T.map(t => chainMin(t.id, new Set())));
  const eta = (median && cpMin > 0)
    ? [Math.max(1, Math.round(cpMin*0.75)), Math.max(2, Math.round(cpMin*1.4))] : null;

  // Stages: the canonical order, and on top of it — whatever state.js sent.
  const given = Array.isArray(S.stages) ? S.stages.filter(Boolean) : [];
  const stages = STAGE_IDS.map(id => given.find(s => s.id === id) || {id, status:'pending'})
    .concat(given.filter(s => !STAGE_IDS.includes(s.id)));
  const stName = s => L.stages[s.id] || s.id;
  const activeStage = stages.find(s => s.status === 'active');
  const curStage = activeStage || stages.find(s => s.status !== 'done' && s.status !== 'skipped');
  const stageNo = curStage ? stages.indexOf(curStage) + 1 : stages.length;
  const t0 = String(S.tier).toUpperCase() === 'T0';
  const buildStage = stages.find(s => s.id === 'build');
  const buildMs = buildStage && buildStage.startedAt && buildStage.finishedAt
    ? activeMs(buildStage.startedAt, buildStage.finishedAt) : null;

  // Project progress as a whole. The weights are shares of time, not "a stage
  // = 1/8": development runs for hours, preflight for minutes. Inside
  // development the scale splits by finished tickets, so it creeps with each
  // one instead of standing still for half a day and then jumping.
  const STAGE_WEIGHT = {preflight:1, manifest:1, briefing:1, spec:2, plan:1, build:6, review:2, final:1};
  const stageFrac = s => {
    if (s.status === 'done' || s.status === 'skipped') return 1;
    if (s.status !== 'active') return 0;                      // pending and failed — zero
    if (s.id === 'build' && T.length) return Math.max(0.05, done.length / T.length);
    return 0.5;
  };
  const totalW = stages.reduce((a,s) => a + (STAGE_WEIGHT[s.id] ?? 1), 0);
  const overallPct = totalW
    ? Math.round(stages.reduce((a,s) => a + (STAGE_WEIGHT[s.id] ?? 1) * stageFrac(s), 0) / totalW * 100) : 0;
  const stagesDone = stages.filter(s => s.status === 'done' || s.status === 'skipped').length;

  const coverage = live ? Math.round((R.done||0)/live*100) : 0;
  // A ticket in review is already written. Counting it as zero would lie
  // low in exactly the place where, before the statuses were split, the
  // page lied high by marking code done before the check.
  const ticketPct = T.length
    ? Math.round((done.length + 0.75*(inReview.length + inRepair.length))/T.length*100) : 0;
  const retries = T.reduce((s,t) => s + (t.retries||0), 0);
  const last = done[done.length-1];
  // The full test run if recorded; otherwise the last pass's tests — a ticket's or a T0 build's.
  const tests = S.tests || (last && last.tests) || (S.singlePass && S.singlePass.tests) || null;
  const debtN = (S.debt?.placeholders?.length||0) + (S.debt?.assumptions?.length||0) + (S.debt?.emptyEnv?.length||0);

  const ring = pct => {
    const r = 34, c = 2*Math.PI*r;
    return `<svg class="ring" viewBox="0 0 80 80" width="84" height="84" aria-hidden="true">
      <circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--ghost)" stroke-width="9"/>
      <circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--accent)" stroke-width="9"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}"
        transform="rotate(-90 40 40)"/></svg>`;
  };
  // Repair is not "a bit more development": the ticket is already written,
  // returned from review, and is being rewritten. While it shared a color
  // with in-progress, only the caption told them apart, and a wave of
  // returns on screen read as ordinary work.
  const statusColor = s => s === 'done' ? 'var(--ok)' : s === 'failed' ? 'var(--bad)'
    : s === 'review' ? 'var(--info)' : s === 'repair' ? 'var(--fix)'
    : s === 'in-progress' ? 'var(--warn)' : 'var(--line)';

  const waves = [...new Set(T.map(t => t.wave ?? 1))].sort((a,b) => a-b);
  // The bar shows STATE, not a share. Its width used to be duration relative
  // to the longest ticket — and a finished ticket at 19 of 28 minutes looked
  // "68% done". A horizontal fill in a task list always reads as progress,
  // so: done — full, running — full with glow and sheen, waiting — an empty
  // dashed outline. Duration lives in the number on the right, where people
  // read it.
  const timeline = T.length ? waves.map(w => {
    const inWave = T.filter(t => (t.wave ?? 1) === w)
      .sort((a,b) => String(a.id).localeCompare(String(b.id), undefined, {numeric:true}));
    const rows = inWave.map(t => {
      const active = ACTIVE.includes(t.status), pend = t.status === 'pending';
      // an unstarted ticket has no clock: "0:00" reads as "running and stuck"
      const clock = (t.startedAt && !pend) ? timerHTML(t.startedAt, t.finishedAt) : '—';
      // "writing" is the base case and reads by color; we caption what was
      // missing from this screen before, otherwise repair is
      // indistinguishable from development
      const ph = (t.status === 'review' || t.status === 'repair') ? (L.phase||{})[t.status] : '';
      return `<div class="row${active?' now':''}${pend?' wait':''}"><b>${esc(t.id)}</b>
        <div class="track"><div class="fill${pend?' pend':''}${active?' active':''}"
          style="width:100%${pend?'':';background:'+statusColor(t.status)}"><span class="nm">${
          esc(t.title)}</span>${ph ? `<em class="ph">${esc(ph)}</em>` : ''}</div></div>
        <div class="mins">${clock}</div></div>`;
    }).join('');
    return `<div class="wave">${L.wave(w, inWave.length)}</div>${rows}`;
  }).join('') : `<div class="empty">${L.noTickets}</div>`;

  // The code-review block — the same table but from the review side: who is
  // checking, what has been checked, and what came back as findings. Opens
  // when the review stage has started or the first ticket has been through
  // the check (insurance against an unrecorded --enter review).
  const revLive = S.reviewers && typeof S.reviewers === 'object'
    ? Object.keys(S.reviewers).filter(k => S.reviewers[k]) : [];
  const revStage = stages.find(s => s.id === 'review');
  const showReview = !!(revStage && revStage.startedAt)
    || T.some(t => t.status === 'review' || t.status === 'repair'
      || (t.repairs || 0) > 0 || (t.repairFindings || []).length > 0
      || (t.concerns || []).length > 0);
  const reviewBlock = !showReview ? '' : `
  <h2>${L.reviewTitle}</h2>
  ${revLive.length ? `<div class="tlnow"><span class="lbl">${L.reviewersLbl}:</span> ${
      revLive.map(k => `<b>${esc((L.revNames||{})[k] || k)}</b>`).join(' · ')}</div>` : ''}
  ${T.length ? `<div class="tlsum">
      <span class="chip ok">${L.revChecked(done.length)}</span>
      ${inReview.length ? `<span class="chip info">${L.chipReview(inReview.length)}</span>` : ''}
      ${inRepair.length ? `<span class="chip fix">${L.chipRepair(inRepair.length)}</span>` : ''}
      ${waiting > 0 ? `<span class="chip">${L.chipWait(waiting)}</span>` : ''}
      ${failedT.length ? `<span class="chip bad">${L.chipFailed(failedT.length)}</span>` : ''}
    </div>
  <div class="scroll"><table>
    <thead><tr><th>${L.thN}</th><th>${L.thTitle}</th><th>${L.thReview}</th><th>${L.thFindings}</th></tr></thead>
    <tbody>${T.map(t => {
      const finds = [...(t.repairFindings || []), ...(t.concerns || [])];
      const badge = t.status === 'done' ? `<span class="chip ok">${L.revPass}</span>`
        : t.status === 'review' ? `<span class="chip info">${esc((L.phase||{}).review||'')}</span>`
        : t.status === 'repair' ? `<span class="chip fix">${esc((L.phase||{}).repair||'')}${
            t.repairs ? ' ×' + t.repairs : ''}</span>`
        : t.status === 'failed' ? `<span class="chip bad">${L.revFailed}</span>`
        : `<span class="chip">${L.revWait}</span>`;
      return `<tr><td><b>${esc(t.id)}</b></td><td>${esc(t.title)}</td><td>${badge}</td>
        <td>${finds.length ? finds.map(f => `<div class="sub">${esc(f)}</div>`).join('')
                           : `<span class="empty">${L.revNone}</span>`}</td></tr>`;
    }).join('')}</tbody>
  </table></div>` : `<div class="empty">${L.noTickets}</div>`}`;

  // Review and repair show only when they exist: six chips in a row on a
  // five-ticket run read worse than four, and zeros carry nothing.
  const tlSum = T.length ? `<div class="tlsum">
      <span class="chip ok">${L.chipDone(done.length)}</span>
      <span class="chip run">${L.chipRun(writing.length)}</span>
      ${inReview.length ? `<span class="chip info">${L.chipReview(inReview.length)}</span>` : ''}
      ${inRepair.length ? `<span class="chip fix">${L.chipRepair(inRepair.length)}</span>` : ''}
      <span class="chip">${L.chipWait(Math.max(0, waiting))}</span>
      ${failedT.length ? `<span class="chip bad">${L.chipFailed(failedT.length)}</span>` : ''}
    </div>` : '';
  // Tickets stand while work goes on — the active stage answers "now":
  // during code review it is the reviewers, during acceptance — the check
  // itself. Otherwise the line would go quiet exactly when "what is being
  // done now" is the most sensible question.
  const tlNow = !T.length ? '' : running.length
    ? `<div class="tlnow"><span class="lbl">${L.nowLbl}</span> ` + running.map(t =>
        `<b>${esc(t.id)}</b> ${esc(t.title)} <span class="lbl">— ${
          esc((L.phase||{})[t.status] || '')}</span> <span class="nowclock" style="color:${
          statusColor(t.status)}">${
          t.startedAt ? timerHTML(t.startedAt, null) : '—'}</span>`).join(' · ') + '</div>'
    : S.finishedAt ? ''
    : activeStage && activeStage.id !== 'build'
      ? `<div class="tlnow"><span class="lbl">${L.nowLbl}</span> <b>${esc(stName(activeStage))}</b>${
          activeStage.id === 'review' && revLive.length
            ? ' <span class="lbl">— ' +
              revLive.map(k => esc((L.revNames||{})[k] || k)).join(' · ') + '</span>' : ''
        } <span class="nowclock" style="color:var(--warn)">${
          activeStage.startedAt ? timerHTML(activeStage.startedAt, null) : ''}</span></div>`
    : done.length === T.length ? ''
    : `<div class="tlnow lbl">${L.nowIdle}</div>`;

  // The stage ribbon — it is also the answer to "where are we" when there are no tickets at all.
  const stageRows = stages.map(s => {
    const dur = s.status === 'skipped' ? L.skipped
      : s.startedAt ? timerHTML(s.startedAt, s.finishedAt)
      : `<span class="empty">${L.notStarted}</span>`;
    return `<div class="st ${esc(s.status || 'pending')}">
      <div class="rail"><i></i></div>
      <div><div class="nm">${esc(stName(s))}</div>${s.note ? `<div class="sub">${esc(s.note)}</div>` : ''}</div>
      <div class="mins">${dur}</div></div>`;
  }).join('');

  const list = arr => arr && arr.length
    ? '<ul class="debt">' + arr.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>'
    : `<div class="empty">${L.none}</div>`;

  const rows = T.map(t => `<tr>
    <td><b>${esc(t.id)}</b></td>
    <td><span class="dot" style="background:${statusColor(t.status)}"></span>${
      hasAddr ? `<button type="button" class="linkb" data-tid="${esc(t.id)}">${esc(t.title)}</button>`
              : esc(t.title)}
      ${t.concerns?.length ? `<div class="sub">${esc(t.concerns.join('; '))}</div>` : ''}</td>
    <td>${(t.requirements||[]).map(r => `<span class="tag">${esc(r)}</span>`).join('') || '<span class="empty">—</span>'}</td>
    <td class="mins">${t.startedAt ? timerHTML(t.startedAt, t.finishedAt) : '—'}</td>
    <td class="mins">${t.retries ? t.retries : ''}${
      t.repairs ? `<span style="color:var(--fix)"> +${t.repairs}</span>` : ''}</td>
    <td class="mins">${t.tests ? (t.tests.failed ? `<span style="color:var(--bad)">${t.tests.failed} ✗</span>` : t.tests.passed + ' ✓') : '—'}</td>
    <td class="mins">${t.commit ? `<code>${esc(t.commit).slice(0,7)}</code>` : '—'}</td>
  </tr>`).join('');

  // Tier T0: there are no tickets by design — instead of an empty table we show the pass itself.
  const sp = S.singlePass || null;
  const t0block = `<div class="note"><b>${L.t0note(sp?.files?.length ? L.t0files(sp.files.length) : '')}</b>
    <div class="sub" style="margin-top:6px">
      ${sp?.startedAt ? `${L.thTime}: ${timerHTML(sp.startedAt, sp.finishedAt)} · ` : ''}
      ${sp?.tests ? `${L.thTests}: ${sp.tests.failed ? `<span style="color:var(--bad)">${sp.tests.failed} ✗</span>` : sp.tests.passed + ' ✓'} · ` : ''}
      ${sp?.commit ? `${L.thCommit}: <code>${esc(sp.commit).slice(0,7)}</code>` : ''}
    </div></div>`;
  const worklog = T.length
    ? `<h2>${L.progress}</h2><div class="tl">${tlSum}${tlNow}${timeline}</div>
       <h2>${L.tblTickets}</h2>
       <div class="scroll"><table>
         <thead><tr><th>${L.thN}</th><th>${L.thTitle}</th><th>${L.thReq}</th><th>${L.thTime}</th>
           <th>${L.thRetry}</th><th>${L.thTests}</th><th>${L.thCommit}</th></tr></thead>
         <tbody>${rows}</tbody>
       </table></div>`
    : (t0 || sp) ? `<h2>${L.stages.build}</h2>${t0block}` : '';

  const blind = S.blind ? `<h2>${L.blind}</h2><div class="card">
      <div class="v">${typeof S.blind.matched === 'number' && typeof S.blind.checked === 'number'
        ? L.blindV(S.blind.matched, S.blind.checked) : '—'}</div>
      ${S.blind.mismatches?.length ? `<div class="sub">${L.blindBad}</div>${list(S.blind.mismatches)}`
        : `<div class="sub">${L.blindOk}</div>`}</div>` : '';

  // Document buttons: manifest, spec, brief, interfaces. A file may not
  // exist yet — then a click honestly says "it lands later" instead of
  // showing garbage.
  const docsBar = hasAddr && (S.dir || S.slug)
    ? `<div class="docs"><span class="lbl">${L.docs}</span>` + [
        ['manifest.md', L.docManifest], ['spec.md', L.docSpec],
        ['interfaces.md', L.docInterfaces], [S.briefFile, L.docBrief],
        ['reference.md', L.docReference],
      ].filter(d => d[0]).map(d =>
        `<button type="button" class="docb" data-doc="${esc(d[0])}">${esc(d[1])}</button>`).join('') +
      '</div>' : '';

  // The audit strip — the same check sync.py prints to the agent, but live:
  // a contradiction in the state is visible on screen within ten seconds,
  // not whenever someone remembers to call sync.
  const aud = auditState(S);
  const audBlock = aud.length
    ? `<div class="note" style="border-color:var(--warn)"><b>${L.auditTitle(aud.length)}</b>
        <ul class="debt">${aud.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : '';

  document.documentElement.lang = L.lang;
  document.getElementById('app').innerHTML = `
  <div class="top">
    <img class="logo l" src="${LOGO_LIGHT}" alt="neopilot">
    <img class="logo d" src="${LOGO_DARK}" alt="neopilot">
    <div class="segs">
      ${S.finishedAt ? '' : `<div class="seg" role="group" aria-label="${L.auto}">
        <button type="button" data-auto title="${autoOn ? L.autoOn : L.autoOff}"
          aria-label="${L.auto}" aria-pressed="${autoOn}">${SYNC}</button>
      </div>`}
      <div class="seg" role="group" aria-label="${L.themeLabel}">
        <button type="button" data-theme="light" title="${L.themeLight}" aria-label="${L.themeLight}"
          aria-pressed="${effectiveTheme()==='light'}">${SUN}</button>
        <button type="button" data-theme="dark" title="${L.themeDark}" aria-label="${L.themeDark}"
          aria-pressed="${effectiveTheme()==='dark'}">${MOON}</button>
      </div>
    </div>
  </div>

  <header>
    <h1>${esc(S.title)}</h1>
    <div class="badges">
      <span class="badge ${MODE_CLS[S.mode]||''}">${esc(L.modes[S.mode] || S.mode)}</span>
      <span class="badge ${DEPTH_CLS[S.depth]||''}">${esc(L.depths[S.depth] || S.depth || '')}</span>
      <span class="badge ${TIER_CLS[String(S.tier).toUpperCase()]||''}">${L.tier(esc(S.tier))}</span>
      ${S.finishedAt ? `<span class="badge b-done">${L.finished}</span>` : ''}
    </div>
  </header>

  <div class="overall">
    <div class="overall-head"><span>${L.overall}</span><b>${overallPct}<small>%</small></b></div>
    <div class="bar lg"><i style="width:${overallPct}%"></i></div>
    <div class="sub">${L.overallStages(stagesDone, stages.length)}${
      T.length ? ' · ' + L.overallTickets(done.length, T.length) : ''}</div>
  </div>

  <div class="grid m">
    <div class="card"><div class="k">${L.coverage}</div>
      <div class="hero">${ring(coverage)}
        <div><div class="v">${coverage}<small>%</small></div>
        <div class="sub">${L.ofReq(R.done||0, live)}${((R.inSpec||0)+(R.inTicket||0)) ? L.inSpec((R.inSpec||0)+(R.inTicket||0)) : ''}</div></div></div>
    </div>
    <div class="card"><div class="k">${L.stage}</div>
      <div class="v stage">${esc(curStage ? stName(curStage) : L.allDone)}</div>
      <div class="sub">${L.stageOf(stageNo, stages.length)}${
        activeStage?.startedAt ? ' · ' + timerHTML(activeStage.startedAt, null) : ''}</div>
    </div>
    <div class="card"><div class="k">${L.elapsed}</div>
      <div class="v">${S.startedAt ? timerHTML(S.startedAt, S.finishedAt) : '—'}</div>
      <div class="sub">${S.startedAt ? L.calendar(fmtClock(spanMs(S.startedAt, S.finishedAt))) + ' · ' : ''}${
        median ? L.median(median) : (buildMs != null ? L.buildTook(fmtClock(buildMs)) : L.tooEarly)}</div>
      <div class="sub stale" data-idle-note hidden>${L.paused}</div>
    </div>
    <div class="card"><div class="k">${L.left}</div>
      <div class="v">${eta ? fmtDur(eta[0]) : '—'}${eta ? `<small> … ${fmtDur(eta[1])}</small>` : ''}</div>
      <div class="sub">${eta ? L.critpath(cp)
        : (t0 ? L.noEta : (T.length && done.length === T.length ? L.wrapUp : L.needTwo))}</div>
    </div>
  </div>

  <div class="grid m">
    <div class="card"><div class="k">${L.tickets}</div>
      <div class="v">${T.length ? `${done.length}<small> / ${T.length}</small>`
        : t0 ? `<span style="font-size:22px">${L.noTicketsTier}</span>` : '—'}</div>
      ${T.length ? `<div class="bar"><i style="width:${ticketPct}%"></i></div>
      <div class="sub">${L.ticketsDone(ticketPct)}${writing.length ? ' · ' + L.chipRun(writing.length) : ''}${
        inReview.length ? ' · ' + L.chipReview(inReview.length) : ''}${
        inRepair.length ? ' · ' + L.chipRepair(inRepair.length) : ''}${
        retries ? L.retries(retries) : ''}</div>`
        : `<div class="sub">${t0 ? L.tier(esc(S.tier)) : L.notCut}</div>`}
    </div>
    <div class="card"><div class="k">${L.debt}</div>
      <div class="v">${debtN}</div>
      <div class="sub">${L.debtSub(S.debt?.placeholders?.length||0, S.debt?.assumptions?.length||0, S.debt?.emptyEnv?.length||0)}</div>
    </div>
    <div class="card"><div class="k">${L.tests}</div>
      <div class="v">${tests ? tests.passed : '—'}${tests && tests.failed ? `<small style="color:var(--bad)"> · ${L.failed(tests.failed)}</small>` : ''}</div>
      <div class="sub">${T.length ? L.testsSub : L.testsSubOne}</div>
    </div>
    <div class="card"><div class="k">${L.reqs}</div>
      <div class="v">${R.total||0}</div>
      <div class="sub">${L.reqsSub(R.dropped||0, R.deferred||0, R.placeholder||0)}</div>
    </div>
  </div>

  ${docsBar}

  ${audBlock}

  <h2>${L.stagesTitle}</h2>
  <div class="stages">${stageRows}</div>

  ${worklog}

  ${reviewBlock}

  <h2>${L.toClose}</h2>
  <div class="grid">
    <div class="card"><div class="k">${L.placeholders}</div>${list(S.debt?.placeholders)}</div>
    <div class="card"><div class="k">${L.assumptions}</div>${list(S.debt?.assumptions)}</div>
    <div class="card"><div class="k">${L.envVars}</div>${list(S.debt?.emptyEnv)}</div>
    ${S.additions?.length ? `<div class="card"><div class="k">${L.additions}</div>${list(S.additions)}</div>` : ''}
  </div>

  ${blind}

  <footer>
    <span>${L.updated}: <span data-ago="${esc(S.updatedAt || '')}"
      title="${S.updatedAt ? esc(new Date(S.updatedAt).toLocaleString('en-GB')) : ''}"
      >${S.updatedAt ? agoText(S.updatedAt) : '—'}</span></span>
    <span>${L.filesIn} <code>.neopilot/${esc(S.dir || S.slug)}/</code></span>
  </footer>`;

  // The tab and the preview card are labelled with the project, not the
  // word "neopilot": when a repository is reworked a second time, this is
  // the only place where one glance shows that the screen holds the
  // previous run, not the one that just started.
  document.title = S.title ? `${S.title} — neopilot` : 'neopilot';

  document.querySelectorAll('.seg button[data-theme]').forEach(b =>
    b.addEventListener('click', () => {
      const t = b.dataset.theme;
      try { localStorage.setItem('neopilot-theme', t); } catch(e) {}
      applyTheme(t);
      document.querySelectorAll('.seg button[data-theme]').forEach(x =>
        x.setAttribute('aria-pressed', String(x.dataset.theme === t)));
    }));

  document.querySelectorAll('.seg button[data-auto]').forEach(b =>
    b.addEventListener('click', () => {
      autoOn = !autoOn;
      try { localStorage.setItem('neopilot-auto', autoOn ? 'on' : 'off'); } catch(e) {}
      b.setAttribute('aria-pressed', String(autoOn));
      b.title = autoOn ? L.autoOn : L.autoOff;
      pollState();
    }));

  document.querySelectorAll('[data-doc]').forEach(b =>
    b.addEventListener('click', () => openDoc(b.dataset.doc, b.title || b.textContent)));

  document.querySelectorAll('.linkb[data-tid]').forEach(b =>
    b.addEventListener('click', () => {
      const t = ((window.STATE || {}).tickets || [])
        .find(x => String(x.id) === b.dataset.tid);
      if (t) openTicket(t);
    }));

  tick();
  pollState();
}

applyTheme(storedTheme());

// State comes from the snapshot inside the page itself, and on top of it —
// from the state.js beside it. A blank screen says nothing about what
// broke, so the page explains — and, unlike the previous version, does not
// give up: the poll keeps going, and once the file appears, the dashboard
// comes alive on its own.
function bootFail(why){
  const app = document.getElementById('app');
  if (!app) return;
  app.innerHTML = '<div class="card"><div class="k">' +
    'Dashboard has no state yet' +
    '</div><div class="sub" style="margin-top:10px">' + why + '</div>' +
    '<div class="sub" style="margin-top:10px">' +
    'The page rechecks the file every ten seconds and will render as soon as it appears. If the build has been running a while, ask the agent to write the state. The build itself is unaffected.' +
    '</div></div>';
}

if (typeof STATE === 'undefined' || !STATE || typeof STATE !== 'object') {
  bootFail('No state either inside the page or in <code>.neopilot/state.js</code> beside it: the run has just started, or the file got mangled.');
  pollState();
} else {
  try {
    render('en');
    lastStamp = stampOf(STATE);
  } catch (e) {
    bootFail(String(e && e.message || e));
    pollState();
  }
}

// The second hand for every open interval and for "updated N ago".
setInterval(tick, 1000);

// Returning to the tab is a reason not to wait for the next poll round.
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); pollState(); } });

// Until the user picks a theme explicitly, the dashboard follows the system.
try {
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (storedTheme()) return;
    document.querySelectorAll('.seg button[data-theme]').forEach(x =>
      x.setAttribute('aria-pressed', String(x.dataset.theme === effectiveTheme())));
  });
} catch(e) {}
</script>
</body>
</html>
